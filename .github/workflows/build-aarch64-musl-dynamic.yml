name: Build Tor Package for OpenWrt (aarch64-musl)

on:
  workflow_dispatch:
  push:

env:
  OPENWRT_VERSION: 25.12.4
  TARGET: bcm27xx
  SUBTARGET: bcm2711
  JOBS: 2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev lib32ncurses-dev \
            libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

      - name: Clone OpenWrt
        run: |
          git clone https://git.openwrt.org/openwrt/openwrt.git -b v${OPENWRT_VERSION} openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add Tor package
        run: |
          mkdir -p openwrt/package/tor
          cat > openwrt/package/tor/Makefile << 'EOF'
          include $(TOPDIR)/rules.mk
          
          PKG_NAME:=tor
          PKG_VERSION:=0.4.9.8
          PKG_RELEASE:=1
          PKG_SOURCE:=$(PKG_NAME)-$(PKG_VERSION).tar.gz
          PKG_SOURCE_URL:=https://dist.torproject.org/
          PKG_HASH:=skip
          
          PKG_MAINTAINER:=OpenWrt
          PKG_LICENSE:=BSD-3-Clause
          PKG_LICENSE_FILES:=LICENSE
          
          PKG_BUILD_PARALLEL:=1
          PKG_INSTALL:=1
          
          include $(INCLUDE_DIR)/package.mk
          
          define Package/tor
            SECTION:=net
            CATEGORY:=Network
            TITLE:=Tor - The Onion Router
            URL:=https://www.torproject.org
            DEPENDS:=+libevent2 +openssl +zlib
          endef
          
          define Package/tor/description
            Tor is a network of virtual tunnels that allows people and groups to improve
            their privacy and security on the Internet.
          endef
          
          TARGET_CFLAGS += -D_GNU_SOURCE
          TARGET_LDFLAGS += -Wl,-rpath-link=$(STAGING_DIR)/usr/lib
          
          CONFIGURE_ARGS += \
            --host=$(GNU_TARGET_NAME) \
            --build=$(GNU_HOST_NAME) \
            --prefix=/usr \
            --sysconfdir=/etc \
            --localstatedir=/var \
            --disable-asciidoc \
            --disable-system-torrc \
            --disable-unittests \
            --disable-tool-name-check \
            --with-libevent-dir=$(STAGING_DIR)/usr \
            --with-openssl-dir=$(STAGING_DIR)/usr \
            --with-zlib-dir=$(STAGING_DIR)/usr
          
          define Package/tor/install
          	$(INSTALL_DIR) $(1)/usr/bin $(1)/etc/tor $(1)/var/lib/tor
          	$(INSTALL_BIN) $(PKG_INSTALL_DIR)/usr/bin/tor $(1)/usr/bin/
          	$(INSTALL_CONF) $(PKG_BUILD_DIR)/src/config/torrc.sample.in $(1)/etc/tor/torrc.sample
          	$(INSTALL_DIR) $(1)/etc/init.d
          	$(INSTALL_BIN) ./files/tor.init $(1)/etc/init.d/tor
          endef
          
          $(eval $(call BuildPackage,tor))
          EOF

      - name: Create init.d script
        run: |
          mkdir -p openwrt/package/tor/files
          cat > openwrt/package/tor/files/tor.init << 'EOF'
          #!/bin/sh /etc/rc.common
          
          START=50
          STOP=50
          
          USE_PROCD=1
          PROG=/usr/bin/tor
          
          start_service() {
            procd_open_instance
            procd_set_param command $PROG -f /etc/tor/torrc
            procd_set_param respawn
            procd_close_instance
          }
          
          stop_service() {
            pkill -f /usr/bin/tor
          }
          EOF
          chmod +x openwrt/package/tor/files/tor.init

      - name: Configure OpenWrt
        run: |
          cd openwrt
          cat > .config << EOF
          CONFIG_TARGET_${SUBTARGET}=y
          CONFIG_TARGET_bcm27xx_bcm2711=y
          CONFIG_TARGET_bcm27xx_bcm2711_DEVICE_rpi-4=y
          CONFIG_PACKAGE_tor=y
          CONFIG_PACKAGE_libevent2=y
          CONFIG_PACKAGE_openssl=y
          CONFIG_PACKAGE_zlib=y
          CONFIG_BUILD_LOG=y
          EOF

      - name: Build OpenWrt
        run: |
          cd openwrt
          make defconfig
          make -j${JOBS} V=s

      - name: Extract Tor binary
        run: |
          cd openwrt
          mkdir -p /tmp/artifacts
          find bin/ -name "*tor*" -type f | while read file; do
            if file "$file" | grep -q ELF; then
              cp "$file" /tmp/artifacts/
            fi
          done
          ls -lh /tmp/artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tor-openwrt-aarch64-musl
          path: /tmp/artifacts/
          retention-days: 30
          if-no-files-found: error
