name: Build Tor for OpenWrt 25.12.4 (bcm2711 aarch64-musl) - self-contained

on:
  workflow_dispatch:
  push:

env:
  OPENWRT_VERSION: 25.12.4
  TARGET_DIR: bcm27xx/bcm2711
  JOBS: 2
  TOR_VERSION: 0.4.8.12

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo add-apt-repository universe
          sudo apt-get update
          sudo apt-get install -y xz-utils ca-certificates curl build-essential \
            git python3 python3-venv python3-pip zstd file
          python3 -m pip install --upgrade setuptools wheel

      - name: Find and extract OpenWrt SDK
        id: find_sdk
        run: |
          SDK_INDEX="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${TARGET_DIR}/"
          html=$(curl -fsS "$SDK_INDEX")
          sdkfile=$(printf "%s" "$html" | grep -oP 'openwrt-sdk[^"]*bcm27xx-bcm2711[^"]*musl[^"]*Linux-x86_64\.tar\.zst' | head -n1)
          if [ -z "$sdkfile" ]; then
            echo "No matching SDK file found at $SDK_INDEX" >&2
            exit 1
          fi
          sdkurl="${SDK_INDEX}${sdkfile}"
          echo "Found SDK: $sdkfile"
          curl -fsSL "$sdkurl" -o /tmp/openwrt-sdk.tar.zst
          tar -xf /tmp/openwrt-sdk.tar.zst -C /tmp
          SDK_DIR=$(tar -tf /tmp/openwrt-sdk.tar.zst | head -n1 | cut -f1 -d"/")
          echo "SDK_DIR=$SDK_DIR" >> $GITHUB_ENV
          echo "SDK extracted to: /tmp/$SDK_DIR"

      - name: Cache downloads and build_dir
        uses: actions/cache@v4
        with:
          path: |
            /tmp/${{ env.SDK_DIR }}/dl
            /tmp/${{ env.SDK_DIR }}/build_dir
          key: openwrt-sdk-${{ env.OPENWRT_VERSION }}-bcm2711-${{ runner.os }}-v1
          restore-keys: |
            openwrt-sdk-${{ env.OPENWRT_VERSION }}-bcm2711-${{ runner.os }}-

      - name: Update and install feeds (critical)
        run: |
          cd /tmp/$SDK_DIR
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Create tor-local package Makefile
        run: |
          SDK="/tmp/$SDK_DIR"
          mkdir -p "$SDK/package/tor-local"
          cat > "$SDK/package/tor-local/Makefile" <<'EOF'
          include $(TOPDIR)/rules.mk

          PKG_NAME:=tor
          PKG_VERSION:=0.4.8.12
          PKG_RELEASE:=1
          PKG_SOURCE:=$(PKG_NAME)-$(PKG_VERSION).tar.gz
          PKG_SOURCE_URL:=https://dist.torproject.org
          PKG_HASH:=skip

          PKG_BUILD_DEPENDS:=libopenssl
          PKG_INSTALL:=1

          include $(INCLUDE_DIR)/package.mk

          define Package/tor
            SECTION:=net
            CATEGORY:=Network
            TITLE:=Tor - onion routing daemon
            DEPENDS:=+libopenssl +libpthread
            URL:=https://www.torproject.org
          endef

          define Package/tor/description
            Tor is free software for enabling anonymous communication.
          endef

          define Build/Configure
            (cd $(PKG_BUILD_DIR); \
              ./configure \
                --host=$(GNU_TARGET_NAME) \
                --build=$(GNU_HOST_NAME) \
                --disable-asciidoc \
                --disable-system-torrc \
                --disable-unittests \
                --without-libevent \
                --with-openssl-dir=$(STAGING_DIR)/usr \
            )
          endef

          define Package/tor/install
            $(INSTALL_DIR) $(1)/usr/bin
            $(INSTALL_BIN) $(PKG_BUILD_DIR)/src/app/tor $(1)/usr/bin/
            $(INSTALL_DIR) $(1)/etc/tor
            $(INSTALL_DATA) $(PKG_BUILD_DIR)/src/config/torrc.sample $(1)/etc/tor/torrc.sample
          endef

          $(eval $(call BuildPackage,tor))
          EOF

      - name: Configure SDK (enable tor and libopenssl) with verbose output
        run: |
          cd /tmp/$SDK_DIR
          # Generate a baseline .config
          make defconfig
          # Manually enable required packages
          sed -i 's/# CONFIG_PACKAGE_tor-local is not set/CONFIG_PACKAGE_tor-local=y/' .config
          sed -i 's/# CONFIG_PACKAGE_libopenssl is not set/CONFIG_PACKAGE_libopenssl=y/' .config
          # Ensure they are present
          grep -q "CONFIG_PACKAGE_tor-local=y" .config || echo "CONFIG_PACKAGE_tor-local=y" >> .config
          grep -q "CONFIG_PACKAGE_libopenssl=y" .config || echo "CONFIG_PACKAGE_libopenssl=y" >> .config
          # Run olddefconfig with verbose output to see what fails
          make olddefconfig V=s
          # Save final .config for debugging
          cp .config /tmp/final.config

      - name: Upload .config for debugging (if step fails)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-config
          path: /tmp/final.config

      - name: Build tor package
        run: |
          cd /tmp/$SDK_DIR
          make package/tor-local/compile V=s

      - name: Collect artifacts
        run: |
          SDK="/tmp/$SDK_DIR"
          mkdir -p /tmp/artifacts
          find "$SDK" -type f -name "tor*.ipk" -exec cp -v {} /tmp/artifacts/ \;
          find "$SDK" -path "*/bin/packages/*" -name "tor*.ipk" -exec cp -v {} /tmp/artifacts/ \;
          ls -la /tmp/artifacts/ || echo "No ipk files found"
          if [ ! "$(ls -A /tmp/artifacts/ 2>/dev/null)" ]; then
            tor_bin=$(find "$SDK" -type f -name "tor" -path "*/src/app/tor" 2>/dev/null | head -1)
            [ -n "$tor_bin" ] && cp "$tor_bin" /tmp/artifacts/
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tor-openwrt-bcm2711-${{ env.OPENWRT_VERSION }}
          path: /tmp/artifacts/
          if-no-files-found: warn
