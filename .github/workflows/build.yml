name: Build Tor for OpenWrt 25.12.4 (bcm2711 aarch64-musl) - self-contained

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *"   # 03:00 UTC on the 1st of each month

permissions:
  contents: write

env:
  OPENWRT_VERSION: 25.12.4
  TARGET_DIR: bcm27xx/bcm2711
  JOBS: 2
  TOR_VERSION: 0.4.8.12   # pin to a known version

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install host deps
        run: |
          sudo apt-get update
          sudo add-apt-repository universe 
          sudo apt-get update 
          sudo apt-get install -y xz-utils ca-certificates curl build-essential git python3 python3-venv python3-pip zstd file
          python3 -m pip install --upgrade setuptools wheel

      - name: Find and extract SDK
        id: find_sdk
        run: |
          SDK_INDEX="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${TARGET_DIR}/"
          echo "Index: $SDK_INDEX"
          html=$(curl -fsS "$SDK_INDEX")
          
          # match actual SDK filename pattern for bcm27xx-bcm2711
          sdkfile=$(printf "%s" "$html" | grep -oP 'openwrt-sdk[^"]*bcm27xx-bcm2711[^"]*musl[^"]*Linux-x86_64\.tar\.zst' | head -n1)
          
          if [ -z "$sdkfile" ]; then
            echo "No matching SDK file found at $SDK_INDEX" >&2
            exit 1
          fi
          
          sdkurl="${SDK_INDEX}${sdkfile}"
          echo "sdkurl=$sdkurl" >> "$GITHUB_OUTPUT"
          echo "Found: $sdkfile"
          
          curl -fsSL "$sdkurl" -o /tmp/openwrt-sdk.tar.zst
          tar -xf /tmp/openwrt-sdk.tar.zst -C /tmp
          
          SDK_DIR=$(tar -tf /tmp/openwrt-sdk.tar.zst | head -n1 | cut -f1 -d"/")
          echo "SDK_DIR=$SDK_DIR" >> $GITHUB_ENV
          echo "SDK extracted to: /tmp/$SDK_DIR"

      - name: Cache downloads and build_dir
        uses: actions/cache@v4
        with:
          path: |
            /tmp/${{ env.SDK_DIR }}/dl
            /tmp/${{ env.SDK_DIR }}/build_dir
          key: openwrt-sdk-${{ env.OPENWRT_VERSION }}-bcm2711-${{ runner.os }}-v1
          restore-keys: |
            openwrt-sdk-${{ env.OPENWRT_VERSION }}-bcm2711-${{ runner.os }}-

      - name: Configure SDK (enable tor and its dependencies)
        run: |
          cd /tmp/$SDK_DIR
          # Start from a clean default config
          make defconfig
          # Enable tor and libopenssl
          ./scripts/config --enable CONFIG_PACKAGE_tor-local
          ./scripts/config --enable CONFIG_PACKAGE_libopenssl
          # Optional: enable IPv6 if needed
          ./scripts/config --enable CONFIG_IPV6
          # Finalize config
          make defconfig

      - name: Create tor package Makefile
        run: |
          SDK="/tmp/$SDK_DIR"
          mkdir -p "$SDK/package/tor-local"
          
          cat > "$SDK/package/tor-local/Makefile" <<'EOF'
          include $(TOPDIR)/rules.mk
          
          PKG_NAME:=tor
          PKG_VERSION:=0.4.8.12
          PKG_RELEASE:=1
          PKG_SOURCE:=$(PKG_NAME)-$(PKG_VERSION).tar.gz
          PKG_SOURCE_URL:=https://dist.torproject.org
          PKG_HASH:=skip
          
          PKG_BUILD_DEPENDS:=libopenssl
          PKG_INSTALL:=1
          
          include $(INCLUDE_DIR)/package.mk
          
          define Package/tor
            SECTION:=net
            CATEGORY:=Network
            TITLE:=Tor - onion routing daemon
            DEPENDS:=+libopenssl +libpthread
            URL:=https://www.torproject.org
          endef
          
          define Package/tor/description
            Tor is a toolset for a wide range of organizations and people that want
            to improve their safety and security on the Internet.
          endef
          
          define Build/Configure
            (cd $(PKG_BUILD_DIR); \
              ./configure \
                --host=$(GNU_TARGET_NAME) \
                --build=$(GNU_HOST_NAME) \
                --disable-asciidoc \
                --disable-system-torrc \
                --disable-unittests \
                --without-libevent \
                --with-openssl-dir=$(STAGING_DIR)/usr \
            )
          endef
          
          define Package/tor/install
            $(INSTALL_DIR) $(1)/usr/bin
            $(INSTALL_BIN) $(PKG_BUILD_DIR)/src/app/tor $(1)/usr/bin/
            $(INSTALL_DIR) $(1)/etc/tor
            $(INSTALL_DATA) $(PKG_BUILD_DIR)/src/config/torrc.sample $(1)/etc/tor/torrc.sample
          endef
          
          $(eval $(call BuildPackage,tor))
          EOF
          
          echo "Package Makefile created"

      - name: Update feeds
        run: |
          cd /tmp/$SDK_DIR
          ./scripts/feeds update -a
          ./scripts/feeds install -a || true

      - name: Build tor package
        run: |
          cd /tmp/$SDK_DIR
          make package/tor-local/compile V=s

      - name: Collect artifacts
        run: |
          SDK="/tmp/$SDK_DIR"
          mkdir -p /tmp/artifacts
          
          find "$SDK" -type f -name "tor*.ipk" -exec cp -v {} /tmp/artifacts/ \;
          find "$SDK" -path "*/bin/packages/*" -name "tor*.ipk" -exec cp -v {} /tmp/artifacts/ \;
          
          if [ -d "$SDK/bin" ]; then
            find "$SDK/bin" -type f -name "*.ipk" -exec cp -v {} /tmp/artifacts/ \;
          fi
          
          echo "Artifacts collected:"
          ls -la /tmp/artifacts/ || echo "No artifacts found"
          
          # Fallback: copy binary if no ipk
          if [ ! "$(ls -A /tmp/artifacts/ 2>/dev/null)" ]; then
            tor_binary=$(find "$SDK" -type f -name "tor" -path "*/src/app/tor" 2>/dev/null | head -1)
            if [ -n "$tor_binary" ]; then
              cp "$tor_binary" /tmp/artifacts/
              echo "Binary copied as fallback"
            fi
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tor-openwrt-bcm2711-${{ env.OPENWRT_VERSION }}
          path: /tmp/artifacts/
          if-no-files-found: warn
